[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librairy"
# Read from `src/librairy/__init__.py`, which is the one place the number
# lives. Declaring it here as well is how the installed metadata came to say
# 1.0.0 while this file said 1.2.0.
dynamic = ["version"]
description = "Privacy-first file organization and library manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
librairy = "librairy.cli:main"

[tool.hatch.version]
path = "src/librairy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/librairy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Expensive large-population benchmarks are opt-in. A suite that takes twenty
# minutes is a suite that stops being run, and the whole value of the scale
# tests is that the cheap ones run every time.
addopts = "-m 'not scale'"
markers = [
  "scale: large-population benchmark; opt in with `-m scale`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

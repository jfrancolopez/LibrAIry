name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Empty unless the repo has Docker Hub credentials; the push step is
      # skipped when it is, so releases still work on a fork without secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      # A version number is a release identity: one number, one build. The tag
      # that triggered this run and the version in the source have to be the
      # same, or the registry ends up with an image tagged one number and
      # labelled another — and two different builds can come to claim the same
      # identity, which is exactly what happened to 1.2.0.
      - name: Refuse a tag that disagrees with the source version
        run: |
          source_version="$(python -c 'import librairy; print(librairy.__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME}  source=${source_version}"
          if [ "${tag_version}" != "${source_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${source_version}"
            exit 1
          fi
          if ! grep -q "^## ${GITHUB_REF_NAME} - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no released section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Test
        run: |
          ruff check src tests scripts
          pytest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/librairy
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/librairy', env.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # So the running container can answer which commit it came from.
          # `librairy version` reads it from the environment; there is no
          # runtime fallback, because a container has no repository in it.
          build-args: |
            LIBRAIRY_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Docker Scout's "required supply chain attestations" policy wants both,
          # and max-mode provenance is what lets it detect the base image exactly
          # instead of guessing.
          provenance: mode=max
          sbom: true

      # BuildKit's own provenance is SLSA v0.2, and Docker Scout's supply-chain
      # policy only accepts v1. There is no buildx flag for the predicate
      # version, so the v1 statement is attached separately.
      - name: Attest build provenance (SLSA v1) on GHCR
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/librairy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (SLSA v1) on Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_USERNAME }}/librairy
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md

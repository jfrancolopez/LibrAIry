services:
  librairy:
    build:
      context: .
      dockerfile: Dockerfile
    image: librairy:latest
    container_name: librairy
    # The image itself defaults to the non-root `librairy` user (uid 1000).
    # Compose starts as root so the entrypoint can remap to PUID/PGID and chown
    # the bind mounts — it still drops privileges before running anything.
    # Set LIBRAIRY_USER=1000:1000 to keep the image default and skip remapping;
    # the host directories then have to be owned by that uid.
    user: "${LIBRAIRY_USER:-0:0}"
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - ${HOST_INBOX_DIR:-./data/inbox}:/data/inbox
      - ${HOST_LIBRARY_DIR:-./data/library}:/data/library
      - ${HOST_QUARANTINE_DIR:-./data/quarantine}:/data/quarantine
      - ${HOST_APPDATA_DIR:-./data/appdata}:/data/appdata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: ["librairy", "run"]

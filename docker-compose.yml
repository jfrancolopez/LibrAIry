services:
  librairy:
    build:
      context: .
      dockerfile: Dockerfile
    image: librairy:latest
    container_name: librairy
    # The image itself defaults to the non-root `librairy` user (uid 1000).
    # Compose starts as root so the entrypoint can remap to PUID/PGID and chown
    # the bind mounts — it still drops privileges before running anything.
    # Set LIBRAIRY_USER=1000:1000 to keep the image default and skip remapping;
    # the host directories then have to be owned by that uid.
    user: "${LIBRAIRY_USER:-0:0}"
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      # DASHBOARD_PORT means the port you browse to on the *host*, and it is
      # the host half of the mapping below. `env_file` would also hand it to
      # the application, which reads it as the port to *bind* — so setting it
      # to anything but 8080 made uvicorn listen on a port nothing was mapped
      # to, the healthcheck curl 8080 and find nothing, and the container sit
      # `unhealthy` forever with a UI you could not reach. Inside the
      # container the port is fixed: it matches EXPOSE, the healthcheck, and
      # the right-hand side of the mapping.
      DASHBOARD_PORT: 8080
    volumes:
      - ${HOST_INBOX_DIR:-./data/inbox}:/data/inbox
      - ${HOST_LIBRARY_DIR:-./data/library}:/data/library
      - ${HOST_QUARANTINE_DIR:-./data/quarantine}:/data/quarantine
      - ${HOST_APPDATA_DIR:-./data/appdata}:/data/appdata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    command: ["librairy", "run"]
